meta:
  project: Cultivar — Industrial Production Tech Tree
  version: 1.0-draft-v3
  node_count: 209
  notes:
  - 'v3: added `produces` (structured item/machine output list) to every node, added 7 new production
    lines (Textiles, Masonry, Jewelry, Consumer Electronics, Papermaking, Hardware Retail, Vehicles) for
    Stock Market richness, rebalanced Lead-Acid (cheap/easy, Tier-2 gated) vs Nickel-Iron (pricier, Tier-3
    gated) batteries, and validated: NO dangling prerequisite references, NO dependency cycles (checked
    programmatically at generation time).'
  - Every node's resource_requirements ARE enforced conceptually as 'must possess these items to research
    this node' — the YAML just doesn't render that visually in a tree diagram; see the SVG's hover-tooltips,
    and the companion items catalog, for that view.
  - All study_hours and resource_requirements quantities remain DRAFT BALANCE VALUES — the coding chat
    should retune freely. Structure (ids, prerequisites, branch, target_type, produces) is the part that
    was deliberately designed and shouldn't be casually changed.
  - branch='unlock' nodes gate crafting/building capability. branch='efficiency' nodes only buff.
  - era is used purely for chart left-to-right ordering; not a hard gameplay gate.
